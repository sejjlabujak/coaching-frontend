<div class="drill-library-sidebar">
  <div class="sidebar-header">Drill Library</div>

  <app-search-input
    placeholder="Search drills..."
    [debounceMs]="300"
    (searchChange)="onSearch($event)"
  ></app-search-input>

  <!-- AI Recommendations box -->
  <div class="ai-box">
    <div class="ai-box-header sticky-section-header" (click)="toggleAi()">
      <span class="ai-box-title">✦ AI Recommendations</span>
      <span class="ai-toggle-icon">{{ aiExpanded() ? '▲' : '▼' }}</span>
    </div>
    <div class="ai-box-body" *ngIf="aiExpanded()">
      <ng-container *ngIf="recommendedDrills.length > 0; else noRecs">
        <drill-card
          *ngFor="let rec of recommendedDrills"
          [drill]="rec"
          [isSidebarMode]="true"
          [isMaxDuration]="isMaxDuration"
          (addDrill)="onDrillAdd($event)"
        ></drill-card>
      </ng-container>
      <ng-template #noRecs>
        <p class="empty-state">No recommendations yet.</p>
      </ng-template>
    </div>
  </div>

  <!-- All drills -->
  <div class="all-drills-section">
    <div class="all-drills-header sticky-section-header">All Drills</div>
    <div class="drills-scroll">
      <drill-card
        *ngFor="let drill of filteredDrills"
        [drill]="drill"
        [isSidebarMode]="true"
        [isMaxDuration]="isMaxDuration"
        (addDrill)="onDrillAdd($event)"
      ></drill-card>
      <p class="empty-state" *ngIf="filteredDrills.length === 0">No drills found.</p>
    </div>
  </div>
</div>
