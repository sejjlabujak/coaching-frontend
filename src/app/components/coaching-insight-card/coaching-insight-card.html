<article class="insight-card"><div class="card-top"><span class="priority" [class]="'priority ' + insight.priority.toLowerCase()">{{ insight.priority }}</span><span class="rank">Priority #{{ rank }}</span></div><h3>{{ insight.title }}</h3><p class="metric">{{ insight.metric }}</p><p class="summary">{{ insight.trainingFocus[0] || 'Training focus available in the full recommendation.' }}</p><button-2 (click)="viewRecommendation.emit(insight)">View recommendation</button-2></article>
