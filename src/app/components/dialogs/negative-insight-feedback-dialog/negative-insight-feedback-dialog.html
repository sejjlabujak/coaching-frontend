<div class="feedback-dialog"><h2>Help us improve this recommendation</h2><p>What wasn't useful?</p>@for(option of ['Not relevant to my team','We’re already working on this','I don’t agree with the analysis','Recommended drills don’t fit my team','Other'];track option){<label><input type="radio" name="reason" [value]="option" [(ngModel)]="reason"> {{ option }}</label>}<label class="comment">Additional comment (optional)<textarea [(ngModel)]="comment" rows="3"></textarea></label><div class="actions"><button-2 type="cancel" (click)="ref.close()">Cancel</button-2><button-2 [disabled]="submitting" (click)="submit()">Submit feedback</button-2></div></div>
