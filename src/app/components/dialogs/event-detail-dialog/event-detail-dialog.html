<div class="dialog-container">
  <div class="title-row">
    <h2 class="dialog-title">{{ event.title }}</h2>
    <span *ngIf="isReadOnly" class="readonly-badge">Past · Read-only</span>
    <div class="title-actions">
      <button class="icon-btn" (click)="onReuse()" title="Reuse this session">
        <mat-icon>content_copy</mat-icon>
      </button>
      <button *ngIf="!isReadOnly && !confirmDelete" class="icon-btn icon-btn-delete" (click)="onDeleteClick()" title="Delete session">
        <mat-icon>delete_outline</mat-icon>
      </button>
      <button class="icon-btn" (click)="onClose()" title="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="detail-row">
    <span class="detail-label">Date:</span>
    <span class="detail-value">{{ event.date | date:'MMMM d, yyyy' }}</span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Duration:</span>
    <span class="detail-value">{{ event.duration }} minutes</span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Intensity:</span>
    <span class="intensity-badge" [ngClass]="'intensity-' + event.intensity?.toLowerCase()">
      {{ event.intensity }}
    </span>
  </div>

  <div class="detail-row focus-row">
    <span class="detail-label">Focus:</span>
  </div>
  <p class="focus-text">{{ event.focus }}</p>

  <div class="detail-row drills-label-row">
    <span class="detail-label">Drills:</span>
  </div>
  <ul class="drills-list">
    <li *ngFor="let drill of event.drills">{{ drill.name }}</li>
  </ul>

  <div class="note-section">
    <label class="detail-label">Note:</label>
    <textarea
      class="note-input"
      [(ngModel)]="noteText"
      rows="3"
      placeholder="Add a note about this session…"
      (blur)="onNoteBlur()"
    ></textarea>
    <span *ngIf="isSavingNote" class="note-status saving">Saving…</span>
    <span *ngIf="noteSavedRecently && !isSavingNote" class="note-status saved">
      <mat-icon>check_circle</mat-icon> Saved
    </span>
  </div>

  <div *ngIf="confirmDelete" class="confirm-delete-row">
    <span>Delete this session?</span>
    <button class="confirm-yes-btn" (click)="onDeleteConfirm()" [disabled]="isDeleting">
      {{ isDeleting ? 'Deleting…' : 'Yes, delete' }}
    </button>
    <button class="confirm-no-btn" (click)="onDeleteCancel()">Cancel</button>
  </div>

  <div *ngIf="!isReadOnly" class="dialog-footer">
    <button-2 (click)="onEditPlan()">Edit Plan</button-2>
  </div>
</div>
