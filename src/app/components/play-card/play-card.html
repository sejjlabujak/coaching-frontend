<button type="button" class="play-card" [class.active]="active" (click)="onSelect()">
  <div class="play-card-top">
    <span class="play-name">{{ play.name }}</span>
    <button
      type="button"
      class="favorite-btn"
      [class.is-favorite]="play.favorite"
      (click)="onToggleFavorite($event)"
      [attr.aria-label]="play.favorite ? 'Unfavorite' : 'Favorite'"
    >
      <mat-icon>{{ play.favorite ? 'star' : 'star_border' }}</mat-icon>
    </button>
  </div>
  <div class="play-card-meta">
    <span class="category-chip">{{ play.category }}</span>
    <span class="modified-date">{{ play.lastModified | date: 'MMM d, y' }}</span>
  </div>
</button>
