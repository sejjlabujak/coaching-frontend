<div class="login-page">
  <div class="login-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>sports_basketball</mat-icon>
      </div>
      <h1 class="brand-name">CoachPro</h1>
      <p class="brand-tagline">Sign in to your account</p>
    </div>

    <!-- Form -->
    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="field-group">
        <label class="field-label" for="username">Username</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">person_outline</mat-icon>
          <input
            id="username"
            class="field-input"
            type="text"
            placeholder="Enter your username"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock_outline</mat-icon>
          <input
            id="password"
            class="field-input"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword" tabindex="-1">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="error()">
        <mat-icon>error_outline</mat-icon>
        {{ error() }}
      </div>

      <button class="submit-btn" type="submit" [disabled]="loading()">
        <span *ngIf="!loading()">Sign In</span>
        <span *ngIf="loading()" class="spinner"></span>
      </button>

    </form>

  </div>
</div>
