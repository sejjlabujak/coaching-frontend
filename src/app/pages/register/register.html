<div class="auth-page"><form class="auth-card" (ngSubmit)="submit()"><h1>Create coach account</h1><p>Join your club/team and verify your email to get started.</p><div class="grid"><label>First name<input [(ngModel)]="form.firstName" name="firstName" required></label><label>Last name<input [(ngModel)]="form.lastName" name="lastName" required></label></div><label>Email<input type="email" [(ngModel)]="form.email" name="email" required></label><label>Club / Team<select [(ngModel)]="form.teamId" name="teamId" required><option [ngValue]="null">Select your team</option>@for(team of teams();track team.id){<option [ngValue]="team.id">{{team.name}}</option>}</select></label><label>Password<input type="password" [(ngModel)]="form.password" name="password" minlength="8" required></label><label>Confirm password<input type="password" [(ngModel)]="form.passwordConfirmation" name="confirmation" required></label>@if(error()){<p class="error">{{error()}}</p>}<button type="submit" [disabled]="loading()">{{loading()?'Creating account…':'Create account'}}</button><p class="link">Already have an account? <a (click)="login()">Sign in</a></p></form></div>
