<div class="page">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h1 class="title">Set Your Password</h1>
      <p class="subtitle">Welcome, <strong>{{ username }}</strong>! Enter your temporary password and choose a new one.</p>
    </div>

    <form class="form" (ngSubmit)="onSubmit()" #form="ngForm">

      <div class="field-group">
        <label class="field-label" for="currentPw">Current (Temporary) Password</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock_outline</mat-icon>
          <input
            id="currentPw"
            class="field-input"
            [type]="showCurrent ? 'text' : 'password'"
            placeholder="Your temporary password"
            [(ngModel)]="currentPassword"
            name="currentPassword"
            required
          />
          <button type="button" class="toggle-pw" (click)="showCurrent = !showCurrent" tabindex="-1">
            <mat-icon>{{ showCurrent ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="newPw">New Password</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock_outline</mat-icon>
          <input
            id="newPw"
            class="field-input"
            [type]="showNew ? 'text' : 'password'"
            placeholder="At least 6 characters"
            [(ngModel)]="newPassword"
            name="newPassword"
            required
          />
          <button type="button" class="toggle-pw" (click)="showNew = !showNew" tabindex="-1">
            <mat-icon>{{ showNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="confirmPw">Confirm New Password</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock_outline</mat-icon>
          <input
            id="confirmPw"
            class="field-input"
            [type]="showConfirm ? 'text' : 'password'"
            placeholder="Repeat your new password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
          <button type="button" class="toggle-pw" (click)="showConfirm = !showConfirm" tabindex="-1">
            <mat-icon>{{ showConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="error()">
        <mat-icon>error_outline</mat-icon>
        {{ error() }}
      </div>

      <button class="submit-btn" type="submit" [disabled]="loading()">
        <span *ngIf="!loading()">Set Password & Continue</span>
        <span *ngIf="loading()" class="spinner"></span>
      </button>

    </form>
  </div>
</div>
