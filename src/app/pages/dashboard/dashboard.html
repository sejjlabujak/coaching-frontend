<app-shell>
  <div class="page-wrapper">
    <h2 class="dashboard-title">Performance Dashboard</h2>

    <!-- Metric Cards -->
    <div class="stats-grid">
      <app-stat-card
        *ngFor="let stat of stats()"
        [label]="stat.label"
        [value]="stat.value"
        [icon]="stat.icon"
        [color]="stat.color"
      ></app-stat-card>
    </div>

    <!-- Error banner -->
    <div *ngIf="error()" class="error-banner">
      {{ error() }}
    </div>

    <!-- Charts and Analysis -->
    <div class="analytics-grid">
      <!-- Recent Home Games -->
      <app-recent-team-games [games]="recentGames()"></app-recent-team-games>

      <!-- Team Analysis -->
      <div class="analysis-wrapper">
        <app-team-analysis [teamAnalysis]="teamAnalysis()"></app-team-analysis>
      </div>
    </div>
  </div>
</app-shell>
