<div class="auth-page"><form class="auth-card" (ngSubmit)="verify()"><h1>Verify your email</h1><p>Enter the six-digit verification code sent to your email.</p><label>Email<input type="email" [(ngModel)]="email" name="email" required></label><label>Verification code<input inputmode="numeric" maxlength="6" [(ngModel)]="code" name="code" required></label>@if(error()){<p class="error">{{error()}}</p>}@if(message()){<p>{{message()}}</p>}<button type="submit" [disabled]="loading()">Verify email</button><p class="link"><a (click)="resend()">Resend code</a></p></form></div>
